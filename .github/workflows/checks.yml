# Checks on every PR and push to main (README, "Tests"): repo checks, unit tests and the type check, secret scan, the
# rules in the Firestore emulator, the browser tests (the real Worker in Node, the emulators, made-up accounts) and the
# same browser tests on a Vite build ("vite"). In the template repo only, the "fill" job also fills a scratch copy as a
# new app and runs the tests there. Jobs run side by side.
# app-devkit blocks are pinned to an exact version; other actions by commit SHA (Dependabot bumps both).
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: flamingbeing/app-devkit/setup-node@v1.9.2
      - uses: flamingbeing/app-devkit/setup-tools@v1.9.2
      - run: node .devkit/tools/check.mjs
      - run: node .devkit/tools/proofread.mjs
      - run: node .devkit/tools/check-links.mjs .
      - run: node tools/stamp-versions.mjs app --check
      - name: sw.js's file list is the generated one; vendored Firebase is gstatic's, at the import map's version
        run: |
          node tools/sw-files.mjs app --check
          node tools/sw-files.mjs e2e/fixtures/outside-package --check
          node tools/vendor-firebase.mjs --check
      - run: node .devkit/tools/build-rules.mjs app/firestore.app.rules --check
      - name: fill values and app/src/config.js are in their canonical form
        run: node tools/fill.mjs --check
      - name: Unit tests (Worker, app, tools; claims.js and custom-token.js equal the pinned devkit's)
        run: node --test 'worker/test/*.test.mjs' 'app/test/*.unit.test.mjs' 'tools/test/*.test.mjs'
      - name: Type check (app/src under strict, against the pinned app-sync's .d.ts)
        run: npm run typecheck

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum checked)
        env:
          V: 8.28.0
          SHA: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "$SHA  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: flamingbeing/app-devkit/setup-node@v1.9.2
        with:
          install: 'false'
      - uses: flamingbeing/app-devkit/setup-emulators@v1.9.2
        with:
          emulators: firestore
          devkit-dir: .devkit
      - name: Rules in the emulator
        working-directory: app
        run: npx -y firebase-tools@13.29.1 emulators:exec --only firestore --project demo-sandbox-app "node --test test/rules.test.mjs"

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: flamingbeing/app-devkit/setup-node@v1.9.2
      - uses: flamingbeing/app-devkit/setup-browser@v1.9.2
      - uses: flamingbeing/app-devkit/setup-emulators@v1.9.2
        with:
          emulators: firestore,auth
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore

  vite:
    # Vite as a check only (README, "Switch to Vite in one PR"): build app/ into dist/ with core, Firebase and
    # register.js kept external, then run the whole browser suite on the built page. Nothing ships from dist/.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: flamingbeing/app-devkit/setup-node@v1.9.2
      - uses: flamingbeing/app-devkit/setup-browser@v1.9.2
      - uses: flamingbeing/app-devkit/setup-emulators@v1.9.2
        with:
          emulators: firestore,auth
      - run: npm run vite
      - name: Browser tests on the Vite build
        run: npx playwright test
        env:
          APP_DIR: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-vite-results
          path: test-results
          if-no-files-found: ignore

  fill:
    # the template only: fill a scratch copy as a new app, then run its checks, rules and browser tests there
    if: github.repository == 'flamingbeing/app-starter'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: flamingbeing/app-devkit/setup-node@v1.9.2
      - uses: flamingbeing/app-devkit/setup-browser@v1.9.2
      - uses: flamingbeing/app-devkit/setup-emulators@v1.9.2
        with:
          emulators: firestore,auth
      - name: Fill a scratch copy
        run: |
          mkdir -p "$RUNNER_TEMP/new-app"
          tar --exclude=.git -cf - . | tar -xf - -C "$RUNNER_TEMP/new-app"
          cd "$RUNNER_TEMP/new-app"
          node tools/fill.mjs --name fill-check --host fill-check.example.net --kit nuhs --project fill-check-app --commit "$GITHUB_SHA"
          node tools/fill.mjs --name fill-check --host fill-check.example.net --kit nuhs --project fill-check-app --commit "$GITHUB_SHA" --check
          ! grep -rIl --exclude-dir=node_modules --exclude-dir=.devkit --exclude='*.log' --exclude=fill.mjs --exclude=fill.test.mjs --exclude=claims.js --exclude=custom-token.js -e 'sandbox-app' -e 'app\.example\.com' .
      - name: Checks on the filled app
        working-directory: ${{ runner.temp }}/new-app
        run: |
          node .devkit/tools/check.mjs
          node tools/stamp-versions.mjs app --check
          node tools/sw-files.mjs app --check
          node --test 'worker/test/*.test.mjs' 'app/test/*.unit.test.mjs'
          npm run typecheck
      - name: Rules on the filled app
        working-directory: ${{ runner.temp }}/new-app/app
        run: npx -y firebase-tools@13.29.1 emulators:exec --only firestore --project demo-fill-check "node --test test/rules.test.mjs"
      - name: Browser tests on the filled app
        working-directory: ${{ runner.temp }}/new-app
        run: npx playwright test
