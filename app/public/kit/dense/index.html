<!doctype html>
<html lang="en" class="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Dense screens gallery</title>
  <script src="../../theme/early.js"></script>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://design.flamingbeing.com/v1/tokens.css">
  <link rel="stylesheet" href="../../theme/theme.css">
  <link rel="stylesheet" href="../../ui/ui.css">
  <link rel="stylesheet" href="../../theme/glass.css">
  <link rel="stylesheet" href="../../ui/gestures.css">
  <link rel="stylesheet" href="../../ui/layout.css">
  <link rel="stylesheet" href="page.css">
  <script type="module" src="page.js"></script>
</head>
<body>
  <!-- Two busy data-entry screens built from the layout parts (grid, stack, split, toolbar, segmented, stepper) at the
       extra-dense level, on made-up data, signed out: a timed readings screen and a case-entry screen.
       Tests: docs/kit-tests.md. Rules: docs/ui-kit.md "Layout parts and extra-dense". -->
  <header class="ui-bar">
    <a class="ui-back kit-home" href="../">Gallery</a>
    <h2 class="ui-bar-title" aria-hidden="true" id="bar-title">Readings</h2>
    <span class="kit-bar-side"></span>
  </header>

  <main>
    <h1 class="ui-large-title" id="page-title">Readings</h1>
    <div class="kit-controls">
      <label class="kit-check"><input type="checkbox" id="dense-on" checked> Extra-dense (this screen)</label>
      <div id="kit-looks" class="kit-looks"></div>
    </div>

    <!-- 1. timed readings: key times, a reading's boxes, the scale beside them on wide screens -->
    <section id="readings" class="kit-screen" data-dense="extra" aria-labelledby="page-title">
      <div class="ui-split" data-split="side">
        <div class="ui-stack" data-gap="pad">
          <div class="ui-stack" data-dir="row">
            <strong>Demo 07</strong><span class="kit-badge">Group B</span>
            <span class="ui-push small" id="next-due">Next: 30 min reading at 08:45</span>
          </div>
          <section aria-labelledby="times-h">
            <h2 id="times-h">Key times</h2>
            <div class="ui-grid" data-cols="6" id="times"></div>
          </section>
          <fieldset class="ui-segmented" id="where">
            <legend>Where</legend>
            <label><input type="radio" name="where" value="before" checked>Before theatre</label>
            <label><input type="radio" name="where" value="in">In theatre</label>
          </fieldset>
          <div class="kit-points">
            <button type="button" class="kit-pn" data-point="-1" aria-label="Previous reading">‹</button>
            <fieldset class="ui-segmented" id="points"><legend>Reading</legend></fieldset>
            <button type="button" class="kit-pn" data-point="1" aria-label="Next reading">›</button>
          </div>
          <section aria-labelledby="reading-h">
            <h2 id="reading-h">30 min reading <span class="small">due 08:45</span></h2>
            <div class="ui-grid kit-board" id="board"></div>
          </section>
          <div class="ui-toolbar" role="toolbar" aria-label="Reading">
            <button type="button" class="ui-primary" id="save-reading">Save 30 min reading</button>
            <button type="button" id="copy-last">Copy last</button>
            <button type="button" class="ui-push" id="clear-reading">Clear boxes</button>
          </div>
        </div>
        <aside class="ui-stack" aria-labelledby="scale-h">
          <h2 id="scale-h">Comfort scale</h2>
          <table class="kit-table">
            <thead><tr><th scope="col">Score</th><th scope="col">Feels</th></tr></thead>
            <tbody id="scale"></tbody>
          </table>
          <h2 id="forms-h">Other forms</h2>
          <nav class="ui-grid" data-cols="3" aria-labelledby="forms-h" id="forms"></nav>
        </aside>
      </div>
    </section>

    <!-- 2. case entry: date, mode, the case box, tags, Save; recent cases beside it on wide screens -->
    <section id="log" class="kit-screen" data-dense="extra" aria-labelledby="page-title" hidden>
      <div class="ui-split" data-split="side">
        <div class="ui-stack" data-gap="pad">
          <div class="ui-toolbar" role="toolbar" aria-label="Date">
            <button type="button" data-day="-1" aria-label="Day before">‹</button>
            <button type="button" id="day" title="Change the date">Tue 27 Oct</button>
            <button type="button" data-day="1" aria-label="Day after">›</button>
            <button type="button" class="ui-push" id="today">Today</button>
          </div>
          <fieldset class="ui-segmented">
            <legend>Logging</legend>
            <label><input type="radio" name="mode" value="one" checked>One case</label>
            <label><input type="radio" name="mode" value="many">Several</label>
            <label><input type="radio" name="mode" value="plan">Plan</label>
          </fieldset>
          <label class="ui-field"><span>Initials (optional)</span>
            <input id="initials" class="kit-input" maxlength="20" autocomplete="off" placeholder="AB"></label>
          <label class="ui-field"><span>Case summary</span>
            <textarea id="summary" class="kit-input" rows="4" placeholder="Age and sex, then the case, e.g. 54m knee scope, spinal"></textarea></label>
          <div class="ui-stack" data-dir="row" aria-label="Suggested tags" role="group" id="suggest"></div>
          <label class="ui-field"><span>Search tags</span>
            <input id="tag-search" class="kit-input" type="search" autocomplete="off" placeholder="Search tags"></label>
          <section aria-labelledby="common-h">
            <h2 id="common-h">Common tags</h2>
            <div class="ui-grid" id="common"></div>
          </section>
          <div class="ui-stack" data-dir="row">
            <label class="kit-check"><input type="checkbox" id="star"> Interesting</label>
            <span class="ui-push small" id="sync-note">Synced</span>
          </div>
          <div class="ui-toolbar" role="toolbar" aria-label="Save">
            <button type="button" id="save-keep">Save, keep date</button>
            <button type="button" class="ui-primary ui-push" id="save-case">Save</button>
          </div>
        </div>
        <aside aria-labelledby="recent-h">
          <h2 id="recent-h">Recent cases</h2>
          <ul class="ui-list" id="recent" aria-labelledby="recent-h"></ul>
        </aside>
      </div>
    </section>
  </main>

  <nav class="ui-tabbar" data-minimise aria-label="Screens">
    <a class="ui-tab" href="#readings" data-screen="readings" aria-current="page">Readings</a>
    <a class="ui-tab" href="#log" data-screen="log">Log a case</a>
  </nav>
</body>
</html>
