<!doctype html>
<html lang="en" class="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Sandbox app</title>
  <script type="importmap">
{
  "imports": {
    "@core/app": "https://core.anawj.com/sync/1.3.12/app.js",
    "@core/auth": "https://core.anawj.com/sync/1.3.12/auth.js",
    "@core/sync": "https://core.anawj.com/sync/1.3.12/sync.js",
    "@core/update": "https://core.anawj.com/sync/1.3.12/update.js",
    "@core/ui": "./ui/index.js",
    "@core/theme": "./theme/index.js",
    "@core/files": "./files/index.js",
    "@core/settings": "./settings/index.js",
    "@core/search": "./search/index.js",
    "app-update/register.js": "https://core.anawj.com/update/0.2.0/register.js",
    "firebase/app": "./vendor/firebase/12.19.0/firebase-app.js",
    "firebase/auth": "./vendor/firebase/12.19.0/firebase-auth.js",
    "firebase/firestore": "./vendor/firebase/12.19.0/firebase-firestore.js"
  }
}
  </script>
  <script src="theme/early.js"></script>
  <script type="module" src="src/boot.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://design.flamingbeing.com/v1/tokens.css">
  <link rel="stylesheet" href="theme/theme.css">
  <link rel="stylesheet" href="ui/ui.css">
  <link rel="stylesheet" href="theme/glass.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="bar">
    <h1>Sandbox app</h1>
    <span id="sync-chip"></span>
  </header>
  <main>
    <section id="signed-out" hidden>
      <p>Sign in to see the list.</p>
      <div id="sign-in-sheet" class="sheet"></div>
    </section>
    <section id="no-access" hidden>
      <p>This account has no access yet. Ask an admin to add it.</p>
      <p class="small">Account id: <code id="uid"></code></p>
    </section>
    <section id="not-set-up" hidden>
      <p>This app isn't connected to its Firebase project yet (see README, "Fill").</p>
    </section>
    <section id="list-view" hidden>
      <div id="conflict-sheet"></div>
      <div id="refused-list"></div>
      <p id="edit-msg" class="small" role="status"></p>
      <div id="search">
        <label for="q">Search</label>
        <input id="q" type="search" autocomplete="off" placeholder="word, &quot;phrase&quot;, -leave out, has:number, is:long">
        <p id="search-msg" class="small" role="status"></p>
      </div>
      <form id="add" autocomplete="off">
        <label for="new-text">New item</label>
        <div class="row">
          <input id="new-text" name="text" maxlength="500" required>
          <button type="submit">Add</button>
        </div>
      </form>
      <p id="count" class="small" role="status" hidden></p>
      <ul id="items" aria-label="Items"></ul>
      <div id="empty"></div>
    </section>
  </main>
  <footer>
    <span id="who"></span>
    <button id="open-settings" type="button" hidden>Settings</button>
    <button id="sign-out" type="button" hidden>Sign out</button>
    <p id="sign-out-msg" class="error" role="alert"></p>
    <div id="update-prompt"></div>
    <div id="theme-switch"></div>
  </footer>

  <div id="toasts"></div>

  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <p><label><input type="checkbox" id="opt-bigRows"> Larger list rows (this device)</label></p>
    <p><label><input type="checkbox" id="opt-itemCount"> Show how many items there are (every device)</label></p>
    <p id="settings-note" class="small">Sign in to change the options that follow your account.</p>
    <div class="row">
      <button id="settings-export" type="button">Export settings</button>
      <label class="file">Import settings <input id="settings-import" type="file" accept="application/json,.json"></label>
    </div>
    <p id="settings-msg" class="small" role="status"></p>
    <div class="row"><button id="settings-close" type="button">Close</button></div>
  </dialog>

  <dialog id="edit" aria-labelledby="edit-title">
    <form method="dialog" id="edit-form">
      <h2 id="edit-title">Edit item</h2>
      <label for="edit-text">Text</label>
      <input id="edit-text" maxlength="500" required>
      <p id="edit-live" class="small" role="status"></p>
      <ul id="edit-files" class="files" aria-label="Photos and files" hidden></ul>
      <button id="edit-attach" type="button">Add photo or file</button>
      <input id="edit-file" type="file" multiple hidden>
      <div class="row">
        <button id="edit-save" value="save">Save</button>
        <button id="edit-delete" value="delete" type="button" class="danger">Delete</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
